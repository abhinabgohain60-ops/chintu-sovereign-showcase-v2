<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chintu // Sovereign Autonomous AI Engineer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #030712; color: #f3f4f6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud { position: relative; z-index: 10; pointer-events: none; padding: 32px; display: flex; justify-content: space-between; align-items: flex-start; height: 100vh; }
        .hud * { pointer-events: auto; }
        .panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(59, 130, 246, 0.4); backdrop-filter: blur(16px); padding: 28px; border-radius: 12px; max-width: 420px; box-shadow: 0 0 35px rgba(59, 130, 246, 0.2); }
        h1 { margin: 0 0 12px 0; font-size: 22px; color: #60a5fa; letter-spacing: 1.5px; }
        p { font-size: 13px; line-height: 1.6; color: #9ca3af; margin: 0 0 20px 0; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .metric-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(59, 130, 246, 0.2); padding: 12px; border-radius: 6px; }
        .metric-label { font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 14px; color: #e2e8f0; font-weight: bold; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: monospace; width: 100%; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #1d4ed8; box-shadow: 0 0 20px rgba(37, 99, 235, 0.6); }
        .status-badge { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 10px #22c55e; }
        .footer-note { margin-top: 16px; font-size: 11px; color: #64748b; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="hud">
        <div class="panel">
            <h1>CHINTU // SOVEREIGN V2</h1>
            <p><span class="status-badge"></span>Autonomous Multi-Agent Orchestration Engine & Three.js WebGL Interactive Sandbox.</p>
            
            <div class="metrics">
                <div class="metric-card">
                    <div class="metric-label">Architecture</div>
                    <div class="metric-value">HMAS Manager</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Sandbox</div>
                    <div class="metric-value">E2B MicroVM</div>
                </div>
            </div>

            <button class="btn" id="scramble-btn">Scramble Cube</button>
            <div class="footer-note">Sovereign Read-Only Environment // Secured</div>
        </div>
    </div>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playMechanicalClick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const size = 0.94;
        const spacing = 1.02;
        const colors = [0xdc2626, 0xd97706, 0x16a34a, 0x2563eb, 0xf8fafc, 0xfacc15];

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const geometry = new THREE.BoxGeometry(size, size, size);
                    const materials = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.25, metalness: 0.1 }));
                    const mesh = new THREE.Mesh(geometry, materials);
                    mesh.position.set(x * spacing, y * spacing, z * spacing);
                    cubeGroup.add(mesh);
                }
            }
        }

        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMouse = { x: e.clientX, y: e.clientY };
            playMechanicalClick();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - prevMouse.x;
            const dy = e.clientY - prevMouse.y;
            cubeGroup.rotation.y += dx * 0.005;
            cubeGroup.rotation.x += dy * 0.005;
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        document.getElementById('scramble-btn').addEventListener('click', () => {
            playMechanicalClick();
            cubeGroup.rotation.x += (Math.random() - 0.5) * (Math.PI * 2);
            cubeGroup.rotation.y += (Math.random() - 0.5) * (Math.PI * 2);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                cubeGroup.rotation.y += 0.0025;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
